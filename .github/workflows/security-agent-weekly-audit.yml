#
# Weekly security audit by ilorium-security-agent (AI). Monday 09:00 UTC.
#
# Runs security-agent/audit.py: dependencies (pip-audit on the verifier when
# it exists), site headers, DNS, organization and repository settings (read
# only), presence of policy files. Opens an issue with the report body.
#
# ZERO-WRITE MODE (founder's decision, governance/decisions/0002-security-agent-zero-write.md):
# the App token below has Contents: read. The agent writes nothing to any
# repository; it only opens issues and comments. AGENT_SIGNOFF is deliberately
# NOT passed to the script, so audit.py takes its no-commit path and opens an
# issue even if someone defines the variable. The founder (or a Custodian) may
# copy the report into governance/security/ through a normal pull request.
# Without SECURITY_AGENT_APP_ID the report is only printed in the job log.
#
# To change this (report branch + pull request via createCommitOnBranch, which
# needs Contents: write), record a new decision in governance/decisions/ first,
# then restore `permission-contents: write` and the AGENT_SIGNOFF env line.

name: security-agent-weekly-audit

on:
  schedule:
    - cron: "0 9 * * 1"   # Monday 09:00 UTC
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Print what would be committed and posted instead of doing it."
        type: boolean
        default: false

permissions: {}

jobs:
  audit:
    name: weekly-audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out the security agent
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check out ilorium-protocol/protocol (read only)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        continue-on-error: true
        with:
          repository: ilorium-protocol/protocol
          ref: main
          path: _protocol
          persist-credentials: false

      - name: Check out ilorium-protocol/site (read only)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        continue-on-error: true
        with:
          repository: ilorium-protocol/site
          ref: main
          path: _site
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install pip-audit (pinned) and dig
        run: |
          python3 -m pip install --disable-pip-version-check "pip-audit==2.10.1"
          sudo apt-get update -qq && sudo apt-get install -y -qq dnsutils > /dev/null

      - name: Agent identity (GitHub App token)
        id: app-token
        if: ${{ vars.SECURITY_AGENT_APP_ID != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.SECURITY_AGENT_APP_ID }}
          private-key: ${{ secrets.SECURITY_AGENT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-metadata: read
          permission-contents: read         # zero-write mode (decision 0002)
          permission-pull-requests: write
          permission-issues: write
          permission-administration: read
          permission-organization-administration: read
          permission-members: read
          permission-vulnerability-alerts: read   # Dependabot alerts
          permission-security-events: read
          permission-secret-scanning-alerts: read

      - name: Run the audit
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          # AGENT_SIGNOFF intentionally not passed: zero-write mode (decision 0002)
          PUBLISH: ${{ vars.SECURITY_AGENT_APP_ID != '' && !inputs.dry-run && '--publish' || '' }}
          DRY: ${{ (vars.SECURITY_AGENT_APP_ID == '' || inputs.dry-run) && '--dry-run' || '' }}
        run: |
          if [ -z "$GITHUB_TOKEN" ]; then echo "planned: App identity not configured; report printed only"; fi
          # shellcheck disable=SC2086
          python3 -I security-agent/audit.py \
            --protocol-dir _protocol --site-dir _site --github-dir . \
            --org "${{ github.repository_owner }}" \
            --out "$RUNNER_TEMP/report.md" --json "$RUNNER_TEMP/observations.json" \
            $PUBLISH $DRY

      - name: Keep the report as a run artifact
        if: always()
        run: |
          echo "## Security report" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY" || true
