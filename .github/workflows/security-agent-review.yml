#
# Reusable workflow: pull request review by ilorium-security-agent (AI).
#
# Called from every repository of the organization as
#   uses: ilorium-protocol/.github/.github/workflows/security-agent-review.yml@main
#   secrets: inherit
#
# What it does: checks out the pull request head, runs deterministic checks
# (security-agent/review.py) and posts ONE sticky comment under the App
# identity. Optional model review runs only when SECURITY_AGENT_LLM_KEY exists
# (planned until the founder sets it).
#
# What it never does: approve, request changes, merge, push, publish, or
# change a setting. The token it uses can only read contents and write
# comments and issues. The job name below is a required status check in the
# rulesets, so a failed run blocks merging until a human looks; findings
# themselves never fail the job.
#
# Trigger note: this runs on `pull_request`, not `pull_request_target`, so the
# head commit's code runs with a read-only workflow token and no secrets from
# forks. For pull requests from forks, the App token step is skipped by GitHub
# (secrets are not available) and the comment falls back to GITHUB_TOKEN, which
# cannot comment on fork PRs; the report then stays in the job log.

name: security-agent-review

on:
  workflow_call:
    inputs:
      model-review:
        description: "Run the optional model review step when the key exists."
        type: boolean
        default: true
        required: false

permissions: {}

jobs:
  security-agent-review:
    name: security-agent-review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write   # comments only (issue comment API); no review-approve call exists in the code
      issues: write
    steps:
      - name: Check out the pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check out the security agent
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ilorium-protocol/.github
          ref: main
          path: .ilorium-security-agent
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Agent identity (GitHub App token)
        id: app-token
        if: ${{ vars.SECURITY_AGENT_APP_ID != '' && github.event.pull_request.head.repo.full_name == github.repository }}
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.SECURITY_AGENT_APP_ID }}
          private-key: ${{ secrets.SECURITY_AGENT_PRIVATE_KEY }}
          # The installation token is scoped to this repository and these permissions only.
          permission-contents: read
          permission-pull-requests: write
          permission-issues: write
          permission-metadata: read

      - name: Write the pull request body to a file
        # The body is third-party data. It goes through a file, never through a shell argument.
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.txt"

      - name: Produce the diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --no-color --no-ext-diff "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/pr.diff"
          wc -c "$RUNNER_TEMP/pr.diff"

      - name: Deterministic review (findings, no posting yet)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          python3 -I .ilorium-security-agent/security-agent/review.py \
            --diff "$RUNNER_TEMP/pr.diff" \
            --title "$PR_TITLE" \
            --body-file "$RUNNER_TEMP/pr-body.txt" \
            --labels "$PR_LABELS" \
            --json "$RUNNER_TEMP/findings.json" \
            --out "$RUNNER_TEMP/review.md" > /dev/null

      - name: Model review (advisory; planned until SECURITY_AGENT_LLM_KEY exists)
        if: ${{ inputs.model-review && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          SECURITY_AGENT_LLM_KEY: ${{ secrets.SECURITY_AGENT_LLM_KEY }}
          SECURITY_AGENT_LLM_MODEL: ${{ vars.SECURITY_AGENT_LLM_MODEL }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 -I .ilorium-security-agent/security-agent/llm_review.py \
            --diff "$RUNNER_TEMP/pr.diff" \
            --title "$PR_TITLE" \
            --body-file "$RUNNER_TEMP/pr-body.txt" \
            --findings-file "$RUNNER_TEMP/findings.json" \
            --out "$RUNNER_TEMP/model-review.md"

      - name: Post the sticky comment
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          IDENTITY: ${{ steps.app-token.outputs.token != '' && '--identity-configured' || '' }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          MODEL=""
          if [ -s "$RUNNER_TEMP/model-review.md" ]; then MODEL="--model-section-file $RUNNER_TEMP/model-review.md"; fi
          # shellcheck disable=SC2086
          python3 -I .ilorium-security-agent/security-agent/review.py \
            --diff "$RUNNER_TEMP/pr.diff" \
            --title "$PR_TITLE" \
            --body-file "$RUNNER_TEMP/pr-body.txt" \
            --labels "$PR_LABELS" \
            --repo "$GITHUB_REPOSITORY" \
            --pr "${{ github.event.pull_request.number }}" \
            --post $IDENTITY $MODEL

      - name: Report in the job log (fork pull requests cannot be commented on)
        if: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: cat "$RUNNER_TEMP/review.md"
