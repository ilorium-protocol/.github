#
# PLANNED: mailbox triage for security@ilorium.com by ilorium-security-agent (AI).
#
# Runs hourly. The first step prints "planned: mailbox triage not configured"
# and the job ends with exit 0 when the secret SECURITY_MAILBOX_SA_KEY (Google
# Workspace service account with domain-wide delegation on security@) is
# absent. When present: reads unread mail, acknowledges with the template
# (AI disclosure, 72-hour commitment), labels the thread, opens a DRAFT
# security advisory in ilorium-protocol/protocol, and notifies the founder.
# It never answers with vulnerability details and never closes a thread.
#
# Secret handling: the service account key is passed to the script only
# through an environment variable; it is never written to disk by the workflow.

name: security-agent-mailbox

on:
  schedule:
    - cron: "23 * * * *"   # hourly
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Read the mailbox but print what would be sent instead of sending."
        type: boolean
        default: true

permissions: {}

jobs:
  mailbox:
    name: mailbox
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Planned until configured
        env:
          CONFIGURED: ${{ secrets.SECURITY_MAILBOX_SA_KEY != '' && 'yes' || 'no' }}
        run: |
          if [ "$CONFIGURED" != "yes" ]; then
            echo "planned: mailbox triage not configured (SECURITY_MAILBOX_SA_KEY absent)"
          fi
          echo "configured=$CONFIGURED" >> "$GITHUB_OUTPUT"
        id: gate

      - name: Check out the security agent
        if: ${{ steps.gate.outputs.configured == 'yes' }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        if: ${{ steps.gate.outputs.configured == 'yes' }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Agent identity (GitHub App token for draft advisories)
        id: app-token
        if: ${{ steps.gate.outputs.configured == 'yes' && vars.SECURITY_AGENT_APP_ID != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.SECURITY_AGENT_APP_ID }}
          private-key: ${{ secrets.SECURITY_AGENT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: protocol
          # Draft security advisories need the App permission "Repository security
          # advisories: write", which this action has no permission-* input for
          # (checked against action.yml at v3.2.0). The token therefore inherits
          # the installation's permissions, narrowed to the protocol repository.
          # Grant that App permission only when the mailbox is configured.

      - name: Triage the mailbox
        if: ${{ steps.gate.outputs.configured == 'yes' }}
        env:
          SECURITY_MAILBOX_SA_KEY: ${{ secrets.SECURITY_MAILBOX_SA_KEY }}
          SECURITY_FOUNDER_EMAIL: ${{ vars.SECURITY_FOUNDER_EMAIL }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          DRY: ${{ inputs.dry-run && '--dry-run' || '' }}
        run: |
          # shellcheck disable=SC2086
          python3 -I security-agent/mailbox.py $DRY
